name: API Tests - Newman CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'evidence/**'
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman and HTML reporter
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run QA Live API collection (data-driven)
        run: |
          newman run postman/qa-live-api-tests.postman_collection.json \
            --environment postman/qa-live-api-env.postman_environment.json \
            --iteration-data data/test-data.json \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export reports/qa-live-api-report.html

      - name: Upload HTML report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: reports/
